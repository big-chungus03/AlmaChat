plugins {
    id 'se.bjurr.violations.violations-gradle-plugin' version '2.0.0' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'se.bjurr.violations.violations-gradle-plugin'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // logging
        implementation 'org.slf4j:slf4j-api:2.0.18'
        implementation 'ch.qos.logback:logback-classic:1.5.38'
    }

    checkstyle {
        toolVersion = '13.8.0'
        ignoreFailures = true
    }

    tasks.register('violations', se.bjurr.violations.gradle.plugin.ViolationsTask) {
        maxRuleColumnWidth = 35
        maxMessageColumnWidth = 120

        minSeverity = se.bjurr.violations.lib.model.SEVERITY.INFO
        detailLevel = se.bjurr.violations.git.ViolationsReporterDetailLevel.VERBOSE
        maxViolations = 0

        violations = [
            ["CHECKSTYLE", layout.buildDirectory.get().asFile.path, ".*/checkstyle/.*\\.xml\$", "Checkstyle"]
        ]
    }

    tasks.named('check') {
        finalizedBy(tasks.named('violations'))
    }
}